[project]
name = "song-tonality-helper"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "yt-dlp",
    "librosa",
    "numpy",
    "scipy",
    "soundfile",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
