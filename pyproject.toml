[project]
name = "tonalidade"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "numpy",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "yt-dlp",
    "librosa",
    "scipy",
    "soundfile",
    "imageio-ffmpeg",
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "uuid-utils>=1.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.fastapi]
entrypoint = "app.main:app"
