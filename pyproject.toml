[project]
name = "song-tonality-helper"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "yt-dlp",
    "librosa",
    "numpy",
    "scipy",
    "soundfile",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "ty",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
