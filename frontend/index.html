<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tonalidade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Song Tonality Helper</title>
  <meta name="description" content="Cole o link de uma música do YouTube e descubra em que tom cantá-la para que a nota mais aguda caia no seu teto.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Song Tonality Helper">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Song Tonality Helper: em que tom você canta essa música?">
  <meta property="og:description" content="Cole o link de uma música do YouTube e descubra em que tom cantá-la para que a nota mais aguda caia no seu teto.">
  <meta property="og:image" content="/brand/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/brand/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img class="pick-logo" src="brand/logo.svg" alt="">
      <span class="brand-name">Song Tonality Helper</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <h1>Em que tom você canta essa música?</h1>
      <p class="lead">Cole o link do YouTube e escolha o seu teto. A gente acha a nota mais aguda e diz quanto transpor.</p>
    </section>

    <form id="form" class="panel stack">
      <label>Link do YouTube
        <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=...">
      </label>
      <label>Meu tom teto
        <select id="ceiling"></select>
      </label>
      <p class="hint">Numeração padrão: dó central = C4.</p>
      <label class="check">
        <input id="extract-now" type="checkbox">
        <span id="extract-now-text">Enviar para o worker</span>
      </label>
      <button id="submit" class="primary big" type="submit">Analisar</button>
    </form>

    <p id="notice" class="banner notice" role="status" hidden></p>
    <p id="status" class="banner status" role="status" hidden></p>
    <p id="error" class="banner error" role="alert" hidden></p>
    <section id="report" hidden></section>

    <section id="history">
      <h2>Músicas já analisadas</h2>
      <ul id="history-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
