<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tonalidade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Tonalidade</title>
  <meta name="description" content="Cole o link de uma música do YouTube e descubra em que tom cantá-la para que a nota mais aguda caia no seu teto.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tonalidade">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Tonalidade: em que tom você canta essa música?">
  <meta property="og:description" content="Cole o link de uma música do YouTube e descubra em que tom cantá-la para que a nota mais aguda caia no seu teto.">
  <meta property="og:image" content="/brand/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/brand/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="locked">
  <section id="auth" class="auth" hidden>
    <div class="auth-brand">
      <img class="pick-logo xl" src="brand/logo.svg" alt="" width="112" height="112">
      <h1>Tonalidade</h1>
      <p class="lead">Em que tom você canta essa música?</p>
    </div>

    <div class="auth-card">
      <div id="auth-tabs" class="tabs" role="tablist">
        <button id="tab-login" class="tab" type="button" role="tab" data-mode="login">Entrar</button>
        <button id="tab-register" class="tab" type="button" role="tab" data-mode="register">Criar conta</button>
      </div>
      <form id="auth-form" class="stack" novalidate>
        <p id="auth-title" class="muted"></p>
        <label data-modes="register">Nome
          <input id="auth-name" type="text" maxlength="80" autocomplete="name" placeholder="Como te chamam">
        </label>
        <label data-modes="login register forgot">E-mail
          <input id="auth-email" type="email" autocomplete="email" placeholder="voce@email.com">
        </label>
        <label data-modes="login register reset">Senha
          <span class="password">
            <input id="auth-password" type="password" minlength="8" maxlength="72" autocomplete="current-password" placeholder="Mínimo de 8 caracteres">
            <button id="toggle-password" type="button" class="ghost small" aria-label="Mostrar senha">Mostrar</button>
          </span>
        </label>
        <label data-modes="register reset">Confirmar senha
          <input id="auth-confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repita a senha">
        </label>
        <p id="auth-message" class="banner" role="alert" hidden></p>
        <button id="auth-submit" class="primary big" type="submit">Entrar</button>
        <button id="auth-link" class="ghost small" type="button"></button>
      </form>
    </div>
  </section>

  <div id="app" hidden inert>
  <header class="top">
    <a class="brand" href="/">
      <img class="pick-logo" src="brand/logo.svg" alt="">
      <span class="brand-name">Tonalidade</span>
    </a>
    <div class="account">
      <span id="user-name" class="hint"></span>
      <button id="logout" class="small" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Em que tom você canta essa música?</h1>
      <p class="lead">Cole o link do YouTube e escolha o seu teto. A gente acha a nota mais aguda e diz quanto transpor.</p>
    </section>

    <form id="form" class="panel stack">
      <label>Link do YouTube
        <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=...">
      </label>
      <label>Meu tom teto
        <select id="ceiling"></select>
      </label>
      <p class="hint">Numeração padrão: dó central = C4.</p>
      <label class="switch-row">
        <span class="switch-text">
          <b>Método de extração</b>
          <small id="extract-now-text">Enviar para o worker (processa em segundo plano)</small>
        </span>
        <input id="extract-now" class="switch" type="checkbox" role="switch">
      </label>
      <button id="submit" class="primary big" type="submit">Analisar</button>
    </form>

    <p id="notice" class="banner notice" role="status" hidden></p>
    <p id="status" class="banner status" role="status" hidden></p>
    <p id="error" class="banner error" role="alert" hidden></p>
    <section id="report" hidden></section>

    <section id="jobs" hidden>
      <h2>Pedidos em andamento</h2>
      <ul id="jobs-list"></ul>
    </section>

    <section id="history">
      <div class="history-head">
        <h2>Músicas já analisadas</h2>
        <button id="history-refresh" class="small" type="button">Atualizar</button>
      </div>
      <ul id="history-list"></ul>
    </section>
  </main>
  </div>
  <script src="app.js?v=16"></script>
</body>
</html>
