<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Tonality Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Song Tonality Helper</h1>
    <p class="lead">Cole o link de uma música do YouTube e descubra em que tom cantá-la para que a nota mais aguda caia no seu teto.</p>

    <form id="form">
      <label for="url">Link do YouTube</label>
      <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=...">

      <label for="ceiling">Meu tom teto</label>
      <select id="ceiling"></select>
      <p class="hint">Numeração: a sua (dó central = C3). Entre parênteses, a numeração padrão (dó central = C4).</p>

      <button id="submit" type="submit">Analisar</button>
    </form>

    <p id="status" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <section id="report" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
